<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Muncher | RetroGrid Games</title>
    <meta name="description" content="Play Dot Muncher for free. An endless, fast-paced arcade collection game. No downloads, 100% offline.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow: hidden; touch-action: none; margin: 0; }
        .pixel-font { font-family: 'Press Start 2P', cursive; }
        #game-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; height: 100vh; background: #020617; border-left: 2px solid #eab308; border-right: 2px solid #eab308; box-shadow: 0 0 30px rgba(234, 179, 8, 0.15); }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="bg-slate-900 border-b border-slate-800 py-3 px-4 z-20 absolute top-0 w-full flex justify-between items-center">
        <a href="/index.html" class="pixel-font text-xs text-yellow-400 hover:text-yellow-300 transition">&lt; BACK TO GRID</a>
    </nav>

    <!-- Game Container -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1 class="pixel-font text-2xl text-yellow-400 mb-4 tracking-widest">DOT MUNCHER</h1>
            <p class="text-slate-300 mb-8 text-xs md:text-sm leading-relaxed max-w-xs">
                Drag anywhere to guide the Muncher.<br><br>
                Eat all the glowing dots.<br>
                Avoid the bouncing red phantoms.<br>
                You have <span class="text-yellow-400 font-bold">3 Lives</span>.
            </p>
            <button id="start-btn" class="pixel-font bg-yellow-600 hover:bg-yellow-500 text-slate-900 py-3 px-6 rounded shadow-[0_0_15px_rgba(234,179,8,0.5)] transition-all transform hover:scale-105">START EATING</button>
        </div>

        <!-- Game Over Overlay -->
        <div id="game-over-screen" class="overlay hidden">
            <h2 class="pixel-font text-3xl text-red-500 mb-2 tracking-widest">CONSUMED</h2>
            <p class="pixel-font text-lg text-white mb-6">SCORE: <span id="final-score" class="text-yellow-400">0</span></p>
            <button id="restart-btn" class="pixel-font bg-yellow-600 hover:bg-yellow-500 text-slate-900 py-3 px-6 rounded shadow-[0_0_15px_rgba(234,179,8,0.5)] transition-all transform hover:scale-105">PLAY AGAIN</button>
        </div>
    </div>

    <!-- The 100% Offline Game Engine -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScore = document.getElementById('final-score');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Audio System
        let audioCtx;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            isAudioInitialized = true;
        }

        function playSound(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // BGM Logic (Quirky synth bass)
        let bgmInterval;
        let bgmTick = 0;
        function startBGM() {
            if (!audioCtx) return;
            if (bgmInterval) clearInterval(bgmInterval);
            bgmInterval = setInterval(() => {
                let freq = bgmTick % 2 === 0 ? 130.81 : 164.81; // C3 to E3
                playSound(freq, 'triangle', 0.15, 0.03);
                bgmTick++;
            }, 350); 
        }

        function stopBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
        }

        // Game State Variables
        let width, height;
        let player, phantoms, dots, score, lives, level, isGameOver;
        let targetX, targetY; 
        let invincibilityTimer = 0; 
        let levelFlashTimer = 0;

        // FPS Limiter Variables
        let lastTime = 0;
        const fps = 60;
        const frameInterval = 1000 / fps;
        let accumulator = 0;
        let animationFrameId;
        let physicsTicks = 0; 

        // Handle Resizing
        function resize() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
            
            if (!player) {
                targetX = width / 2;
                targetY = height / 2;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Controls (Mouse and Touch)
        canvas.addEventListener('touchmove', (e) => {
            if(isGameOver) return;
            e.preventDefault();
            targetX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            targetY = e.touches[0].clientY - canvas.getBoundingClientRect().top;
        }, { passive: false });

        canvas.addEventListener('mousemove', (e) => {
            if(isGameOver) return;
            targetX = e.clientX - canvas.getBoundingClientRect().left;
            targetY = e.clientY - canvas.getBoundingClientRect().top;
        });

        // Generate Board
        function spawnDots(count) {
            dots = [];
            for(let i = 0; i < count; i++) {
                dots.push({
                    x: Math.random() * (width - 40) + 20,
                    y: Math.random() * (height - 120) + 80 // Keep away from UI edges
                });
            }
        }

        function spawnPhantom() {
            let size = 16;
            let speed = Math.min(6, 2.5 + (level * 0.4)); // Caps phantom speed
            let isHorizontal = Math.random() > 0.5;
            
            // Spawn far away from player
            let px = player.x < width / 2 ? width - 30 : 30;
            let py = player.y < height / 2 ? height - 30 : 80;

            phantoms.push({
                x: px,
                y: py,
                size: size,
                vx: isHorizontal ? speed : speed * 0.5,
                vy: !isHorizontal ? speed : speed * 0.5
            });
        }

        // Setup Game
        function initGame() {
            player = {
                x: width / 2,
                y: height / 2,
                radius: 14,
                angle: 0
            };
            targetX = width / 2;
            targetY = height / 2;
            
            phantoms = [];
            score = 0;
            lives = 3;
            level = 1;
            invincibilityTimer = 0;
            levelFlashTimer = 0;
            physicsTicks = 0;
            isGameOver = false;

            spawnDots(10 + (level * 2));
            spawnPhantom(); // Start with 1 phantom

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            startBGM();

            lastTime = performance.now();
            accumulator = 0;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Fixed Time-Step Game Loop
        function gameLoop(currentTime) {
            if (isGameOver) return;
            animationFrameId = requestAnimationFrame(gameLoop);

            let deltaTime = currentTime - lastTime;
            if (deltaTime > 250) deltaTime = 250; 
            lastTime = currentTime;
            accumulator += deltaTime;

            while (accumulator >= frameInterval) {
                updatePhysics();
                accumulator -= frameInterval;
            }
            
            draw();
        }

        function updatePhysics() {
            physicsTicks++;
            if (invincibilityTimer > 0) invincibilityTimer--;
            if (levelFlashTimer > 0) levelFlashTimer--;

            // Move Player Smoothly towards pointer
            let dx = targetX - player.x;
            let dy = targetY - player.y;
            
            player.x += dx * 0.15;
            player.y += dy * 0.15;

            // Calculate rotation angle for drawing the mouth
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                player.angle = Math.atan2(dy, dx);
            }
            
            // Constrain player
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > width - player.radius) player.x = width - player.radius;
            if (player.y < player.radius + 50) player.y = player.radius + 50; // Top nav buffer
            if (player.y > height - player.radius) player.y = height - player.radius;

            // Move Phantoms
            for (let p of phantoms) {
                p.x += p.vx;
                p.y += p.vy;

                // Bounce off walls
                if (p.x < p.size || p.x > width - p.size) p.vx *= -1;
                if (p.y < p.size + 50 || p.y > height - p.size) p.vy *= -1;

                // Player Collision
                if (invincibilityTimer <= 0) {
                    let distToPlayer = Math.hypot(player.x - p.x, player.y - p.y);
                    if (distToPlayer < player.radius + p.size - 4) { // -4 forgiving hitbox
                        lives--;
                        if (lives <= 0) {
                            triggerGameOver();
                            return;
                        } else {
                            playSound(150, 'sawtooth', 0.5, 0.4); 
                            invincibilityTimer = 90; // 1.5 seconds i-frames
                        }
                    }
                }
            }

            // Dot Collision
            for (let i = dots.length - 1; i >= 0; i--) {
                let d = dots[i];
                let distToDot = Math.hypot(player.x - d.x, player.y - d.y);
                if (distToDot < player.radius + 6) {
                    dots.splice(i, 1);
                    score += 10;
                    playSound(1200, 'sine', 0.05, 0.1); // Munch sound
                }
            }

            // Wave Clear Logic
            if (dots.length === 0) {
                level++;
                score += 50; // Wave clear bonus
                levelFlashTimer = 30;
                playSound(600, 'square', 0.3, 0.2); // Level up sound
                spawnDots(10 + (level * 2)); // More dots
                spawnPhantom(); // Add another enemy
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            stopBGM();
            playSound(100, 'sawtooth', 0.8, 0.4); 
            finalScore.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        // Rendering
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Level up Flash effect
            if (levelFlashTimer > 0) {
                ctx.fillStyle = `rgba(234, 179, 8, ${levelFlashTimer / 60})`;
                ctx.fillRect(0, 0, width, height);
            }

            // Draw Dots
            ctx.fillStyle = '#fde047'; // Bright Yellow
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fde047';
            for (let d of dots) {
                ctx.beginPath();
                ctx.arc(d.x, d.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Phantoms (Red Squares)
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ef4444';
            for (let p of phantoms) {
                ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
                
                // Little evil eyes
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 0;
                ctx.fillRect(p.x - p.size/2 - 2, p.y - p.size/2, 4, 4);
                ctx.fillRect(p.x + p.size/2 - 2, p.y - p.size/2, 4, 4);
                ctx.fillStyle = '#ef4444';
                ctx.shadowBlur = 15;
            }

            // Draw Player 
            if (invincibilityTimer === 0 || Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.fillStyle = (invincibilityTimer > 0) ? '#ffffff' : '#eab308'; 
                ctx.shadowBlur = 20;
                ctx.shadowColor = (invincibilityTimer > 0) ? '#ffffff' : '#eab308';
                
                // Chomping animation math
                let mouthOpen = 0.2 + 0.2 * Math.sin(physicsTicks * 0.3); // Oscillates between 0 and 0.4
                
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);
                
                ctx.beginPath();
                // Draw arc leaving a wedge for the mouth
                ctx.arc(0, 0, player.radius, mouthOpen * Math.PI, (2 - mouthOpen) * Math.PI);
                ctx.lineTo(0, 0);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }
            
            ctx.shadowBlur = 0;

            // Draw UI 
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.font = "bold 50px 'Press Start 2P', monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(score, width / 2, height / 2);

            ctx.fillStyle = '#eab308'; 
            ctx.font = "12px 'Press Start 2P', monospace";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            ctx.fillText(`WAVE:${level}`, 15, 60);

            ctx.textAlign = "right";
            let hearts = "";
            for(let i=0; i<lives; i++) hearts += "♥ ";
            ctx.fillText(hearts, width - 15, 60);
        }

        // Button Listeners
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', initGame);
    </script>
</body>
</html>
