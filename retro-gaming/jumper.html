<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Jumper | RetroGrid Games</title>
    <meta name="description" content="Play Neon Jumper for free. An endless, addictive 2D jumping arcade game. No downloads, 100% offline.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; overflow: hidden; touch-action: none; margin: 0; }
        .pixel-font { font-family: 'Press Start 2P', cursive; }
        #game-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; height: 100vh; background: #1e293b; border-left: 2px solid #3b82f6; border-right: 2px solid #3b82f6; box-shadow: 0 0 30px rgba(59, 130, 246, 0.2); }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="bg-slate-900 border-b border-slate-800 py-3 px-4 z-20 absolute top-0 w-full flex justify-between items-center">
        <a href="/index.html" class="pixel-font text-xs text-blue-400 hover:text-blue-300 transition">&lt; BACK TO GRID</a>
    </nav>

    <!-- Game Container -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1 class="pixel-font text-2xl text-green-400 mb-4 tracking-widest">NEON JUMPER</h1>
            <p class="text-slate-300 mb-8 text-xs md:text-sm leading-relaxed max-w-xs">
                Tap left/right or use Arrow Keys to move.<br><br>
                <span class="text-blue-400">BLUE:</span> Normal<br>
                <span class="text-purple-400">PURPLE:</span> Moving<br>
                <span class="text-red-400">RED:</span> Breaks on impact
            </p>
            <button id="start-btn" class="pixel-font bg-blue-600 hover:bg-blue-500 text-white py-3 px-6 rounded shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all transform hover:scale-105">START GAME</button>
        </div>

        <!-- Game Over Overlay -->
        <div id="game-over-screen" class="overlay hidden">
            <h2 class="pixel-font text-3xl text-red-500 mb-2 tracking-widest">SYSTEM FAILURE</h2>
            <p class="pixel-font text-lg text-white mb-6">SCORE: <span id="final-score" class="text-green-400">0</span></p>
            <button id="restart-btn" class="pixel-font bg-green-600 hover:bg-green-500 text-white py-3 px-6 rounded shadow-[0_0_15px_rgba(22,163,74,0.5)] transition-all transform hover:scale-105">REBOOT</button>
        </div>
    </div>

    <!-- The 100% Offline Game Engine -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScore = document.getElementById('final-score');
        
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Internal Web Audio API Synthesizer
        let audioCtx;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            isAudioInitialized = true;
        }

        function playSound(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // BGM Logic
        let bgmInterval;
        const notes = [220, 293.66, 329.63, 440, 329.63, 293.66]; 
        let noteIndex = 0;

        function startBGM() {
            if (!audioCtx) return;
            if (bgmInterval) clearInterval(bgmInterval);
            bgmInterval = setInterval(() => {
                playSound(notes[noteIndex], 'square', 0.15, 0.02);
                noteIndex = (noteIndex + 1) % notes.length;
            }, 250); // Slowed down slightly for retro feel
        }

        function stopBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
        }

        // Game Variables
        let width, height;
        let player, platforms, score, highestY, isGameOver;
        let keys = { left: false, right: false };

        // FPS Limiter Variables
        let lastTime = 0;
        const fps = 60;
        const frameInterval = 1000 / fps;
        let accumulator = 0;
        let animationFrameId;

        // Resize Canvas to fit container safely below navbar
        function resize() {
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        });

        // Touch Controls for Mobile
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouch);
        canvas.addEventListener('touchend', () => { keys.left = false; keys.right = false; });

        function handleTouch(e) {
            if (isGameOver) return;
            e.preventDefault();
            const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            if (touchX < width / 2) { keys.left = true; keys.right = false; } 
            else { keys.right = true; keys.left = false; }
        }

        // Setup Game State
        function initGame() {
            player = {
                x: width / 2 - 15,
                y: height - 150,
                width: 30,
                height: 30,
                vy: 0,
                vx: 0,
                speed: 6, // Horizontal movement speed
                jumpPower: -11, // Upward force
                gravity: 0.45 // Downward pull
            };
            
            platforms = [];
            score = 0;
            highestY = player.y;
            isGameOver = false;

            // Generate initial safe platforms
            platforms.push({ x: width / 2 - 40, y: height - 20, width: 80, height: 12, type: 'normal' });
            for (let i = 1; i < 7; i++) {
                spawnPlatform(height - 20 - (i * 110), true); // force normal platforms at start
            }

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            startBGM();

            lastTime = performance.now();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function spawnPlatform(yLoc, forceNormal = false) {
            const pWidth = 60 + Math.random() * 30;
            const pX = Math.random() * (width - pWidth);
            
            let pType = 'normal';
            let speed = 0;
            let dir = 1;

            if (!forceNormal) {
                const rand = Math.random();
                // Difficulty scaling based on score
                let movingChance = score > 1000 ? 0.4 : 0.2;
                let breakableChance = score > 2000 ? 0.3 : 0.15;

                if (rand < breakableChance) {
                    pType = 'breakable';
                } else if (rand < breakableChance + movingChance) {
                    pType = 'moving';
                    speed = 1.5 + Math.random() * 2;
                    dir = Math.random() > 0.5 ? 1 : -1;
                }
            }

            platforms.push({ x: pX, y: yLoc, width: pWidth, height: 12, type: pType, speed: speed, dir: dir, broken: false });
        }

        // Fixed Time-Step Game Loop
        function gameLoop(currentTime) {
            if (isGameOver) return;
            animationFrameId = requestAnimationFrame(gameLoop);

            let deltaTime = currentTime - lastTime;
            if (deltaTime > 250) deltaTime = 250; // Cap to prevent massive jumps if tab is inactive
            lastTime = currentTime;
            accumulator += deltaTime;

            while (accumulator >= frameInterval) {
                updatePhysics();
                accumulator -= frameInterval;
            }
            draw();
        }

        function updatePhysics() {
            // Player Horizontal Movement
            if (keys.left) player.vx = -player.speed;
            else if (keys.right) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;
            player.vy += player.gravity;
            player.y += player.vy;

            // Screen Wrap
            if (player.x > width) player.x = -player.width;
            if (player.x + player.width < 0) player.x = width;

            // Platform Collision & Logic
            if (player.vy > 0) { // Only collide when falling
                for (let i = 0; i < platforms.length; i++) {
                    let p = platforms[i];
                    if (!p.broken && player.x < p.x + p.width && player.x + player.width > p.x &&
                        player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.vy) {
                        
                        player.vy = player.jumpPower; 
                        
                        if (p.type === 'breakable') {
                            p.broken = true;
                            playSound(800, 'sawtooth', 0.1, 0.05); // Glass break sound
                        } else {
                            playSound(600, 'sine', 0.1, 0.1); // Normal jump sound
                        }
                    }
                }
            }

            // Move Moving Platforms
            platforms.forEach(p => {
                if (p.type === 'moving' && !p.broken) {
                    p.x += p.speed * p.dir;
                    if (p.x <= 0 || p.x + p.width >= width) p.dir *= -1; // Bounce off walls
                }
            });

            // Camera follow (Scroll screen up)
            if (player.y < height / 2) {
                let diff = (height / 2) - player.y;
                player.y += diff;
                highestY -= diff; 
                
                // Real-time precise score calculation
                let currentScore = Math.floor(Math.abs(highestY));
                if (currentScore > score) score = currentScore;
                
                platforms.forEach(p => p.y += diff);
            }

            // Platform Management (Recycle old platforms at bottom to top)
            platforms = platforms.filter(p => p.y < height);
            while (platforms.length < 7) {
                let highestPlatformY = Math.min(...platforms.map(p => p.y));
                // Space platforms slightly further apart as game progresses
                let gap = 100 + Math.min(score / 100, 60); 
                spawnPlatform(highestPlatformY - gap - (Math.random() * 30));
            }

            // Death Condition
            if (player.y > height) {
                isGameOver = true;
                stopBGM();
                playSound(150, 'sawtooth', 0.5, 0.2); // Death sound
                playSound(100, 'sawtooth', 0.8, 0.2);
                
                finalScore.innerText = score;
                gameOverScreen.classList.remove('hidden');
            }
        }

        // Rendering
        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw Platforms
            platforms.forEach(p => {
                if (p.broken) return;

                if (p.type === 'normal') {
                    ctx.fillStyle = '#3b82f6';
                    ctx.shadowColor = '#3b82f6';
                } else if (p.type === 'moving') {
                    ctx.fillStyle = '#a855f7';
                    ctx.shadowColor = '#a855f7';
                } else if (p.type === 'breakable') {
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#ef4444';
                }
                
                ctx.shadowBlur = 10;
                ctx.fillRect(p.x, p.y, p.width, p.height);
            });

            // Draw Player 
            ctx.fillStyle = '#4ade80';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#4ade80';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Reset shadows 
            ctx.shadowBlur = 0;

            // Draw Canvas Native Score
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.font = "bold 60px 'Press Start 2P', monospace";
            ctx.textAlign = "center";
            ctx.fillText(score, width / 2, height / 2 + 50);
        }

        // Button Listeners
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', initGame);

    </script>
</body>
</html>
